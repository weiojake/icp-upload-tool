name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages pyinstaller playwright psutil customtkinter pillow

      - name: 打包 macOS App
        run: |
          pyinstaller --windowed --name="ICP备案批量上传工具" --icon=logo.icns icp_upload_tool.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ICP备案批量上传工具-macOS
          path: dist/ICP备案批量上传工具.app
